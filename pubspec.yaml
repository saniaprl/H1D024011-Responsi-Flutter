name: meteora
description: "Aplikasi informasi cuaca real-time Meteora."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/meteora_logo.png
    - assets/images/meteora_wordmark.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/meteora_logo.png
  adaptive_icon_background: "#ECF4E8"
  adaptive_icon_foreground: assets/images/meteora_logo.png
  min_sdk_android: 21
